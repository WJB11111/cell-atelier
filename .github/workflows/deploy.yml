name: Deploy to GitHub Pages

# Builds the site and publishes it. Everything the build needs is in the
# repository: the models are committed under public/, and the Blender scripts are
# not part of this path at all — a deploy never has to run Blender.
#
# One-time setup after the first push:
#   Settings → Pages → Build and deployment → Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race: the service worker's cache name is derived from the
# build, so a half-published bundle would leave a stale cache behind.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Report bundle size
        run: |
          du -sh dist
          du -sh dist/*.glb 2>/dev/null | tail -3 || true
          node -e "const {readFileSync}=require('fs');const sw=readFileSync('dist/sw.js','utf8');console.log(sw.match(/const PRECACHE = \[[^\]]*\]/)[0].split(',').length + ' files precached')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
